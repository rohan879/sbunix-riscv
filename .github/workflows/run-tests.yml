name: "Run tests"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    permissions:
      contents: write
      issues: write

    steps:
      - name: Prepare dependencies
        run: |
          set -euo pipefail

          repo_dir="$GITHUB_WORKSPACE"
          repo_url="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          checkout_ref="${GITHUB_SHA}"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            repo_url="${{ github.event.pull_request.head.repo.clone_url }}"
            checkout_ref="${{ github.event.pull_request.head.sha }}"
          fi

          install_apt() {
            sudo apt-get update -qq
            sudo apt-get install -y -qq \
              build-essential \
              git curl wget \
              strace tmux vim htop screen \
              python3 python3-serial python3-pip \
              jq bc patch \
              libfdt-dev libfdt1 \
              libpixman-1-dev libpixman-1-0 \
              libslirp-dev libslirp0 \
              libglib2.0-dev \
              libncurses-dev \
              libssl-dev \
              autoconf automake autotools-dev \
              libmpc-dev libmpfr-dev libgmp-dev \
              gawk texinfo libtool patchutils zlib1g-dev \
              libexpat1-dev \
              ninja-build pkg-config \
              flex bison \
              libusb-1.0-0-dev
          }

          download_deps() {
            cd /tmp
            wget -nv https://github.com/stevennyman/os-dep/releases/download/initial/os-dep.zip
          }

          clone_repo() {
            clone_dir="$(mktemp -d /tmp/sbunix-clone.XXXXXX)"
            git clone --depth 1 --recurse-submodules --shallow-submodules --no-tags "$repo_url" "$clone_dir"
            cd "$clone_dir"
            git checkout --force "$checkout_ref"
            rm -rf "$repo_dir"
            mv "$clone_dir" "$repo_dir"
          }

          clone_repo &
          clone_pid=$!
          install_apt &
          apt_pid=$!
          download_deps &
          download_pid=$!

          wait "$download_pid"

          cd /tmp
          unzip -q os-dep.zip
          rm os-dep.zip
          wait "$clone_pid"
          wait "$apt_pid"
      - name: Build OS
        run: |
          cd sbunix-skeleton/
          pwd
          source tools/cisourceme.sh
          make clean
          RUN_CI_TESTS=1 make -j$(nproc)
      - name: Boot OS in QEMU and run custom boot tests, Sortix os-test, and open-posix-test suites
        id: qemu_tests
        run: |
          set -euo pipefail
          cd sbunix-skeleton/
          source tools/cisourceme.sh
          RUN_CI_TESTS=1 make qemu 2>&1 | tee /tmp/sbunix-qemu.log
      - name: Build commit comment body
        run: |
          set -euo pipefail
          log=/tmp/sbunix-qemu.log
          body="$GITHUB_WORKSPACE/sbunix-commit-comment.md"

          {
            printf 'SBUnix test results for `%s`\n\n' "${GITHUB_SHA}"

            printf '### Boot tests\n'
            awk '
              /=== Summary ===/ { printing=1 }
              printing { print }
              /To run Sortix os-test POSIX compliance suite:/ { exit }
            ' "$log" | sed '$d'

            printf '\n### Sortix os-test\n'
            awk '
              /=== Final Results ===/ { count++; if (count == 1) { printing=1 } }
              printing { print }
              printing && /^Usage:$/ { exit }
            ' "$log" | sed '$d'

            printf '\n### Open POSIX test suite\n'
            awk '
              /=== Final Results ===/ { count++; if (count == 2) { printing=1 } }
              printing { print }
              printing && /^Usage:$/ { exit }
            ' "$log" | sed '$d'
          } > "$body"

          cat "$body"
      - name: Comment on commit with test summary
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: peter-evans/commit-comment@v4
        with:
          body-path: ${{ github.workspace }}/sbunix-commit-comment.md
      - name: Comment on pull request with test summary
        if: ${{ github.event_name == 'pull_request' }}
        uses: mshick/add-pr-comment@v2
        with:
          message-path: ${{ github.workspace }}/sbunix-commit-comment.md
          message-id: sbunix-test-summary
