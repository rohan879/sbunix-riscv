name: "PR Comment"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-slim

    # Set the permissions to the lowest permissions possible needed for your steps.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Get commit message
        id: get_commit_message
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request?.head?.sha // For pull_request event
                        ?? context.payload.merge_group?.head_sha // For merge_group event
                        ?? context.sha, // For push, workflow_dispatch, or other direct context.sha events
            });

            core.setOutput('value', data?.commit?.message);
      - name: Comment on pull request with test summary
        if: ${{ steps.get_commit_message.outputs.value }}
        uses: mshick/add-pr-comment@v2
        with:
          message: ${{ steps.get_commit_message.outputs.value }}