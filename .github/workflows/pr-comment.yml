name: Repost Commit Comments to PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  repost-comments:
    runs-on: ubuntu-slim

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Get latest commit SHA
        id: sha
        run: |
          echo "sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT

      - name: Fetch commit comments
        id: fetch_comments
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/commits/${{ steps.sha.outputs.sha }}/comments \
            > comments.json

      - name: Filter bot comments
        id: filter
        run: |
          jq -c '.[] | select(.user.login=="github-actions[bot]")' comments.json > bot_comments.json
          count=$(jq -s 'length' bot_comments.json)
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Repost to PR
        if: steps.filter.outputs.count != '0'
        run: |
          pr_number=${{ github.event.pull_request.number }}
          while IFS= read -r comment; do
            body=$(echo "$comment" | jq -r '.body')
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/issues/$pr_number/comments \
              -d "$(jq -n --arg body "$body" '{body: $body}')"
          done < bot_comments.json